name: Deploy Kalatty

on:
  push:
    branches:
      - master
    paths:
      - backend/**
      - .github/workflows/deploy-kalatty.yml
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

jobs:
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate Railway secrets
        run: test -n "${{ secrets.RAILWAY_TOKEN }}" || (echo "Missing RAILWAY_TOKEN secret" && exit 1)

      - name: Deploy Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set +e
          output=$(npx -y @railway/cli up ./backend --path-as-root --detach --yes \
            --service a21168e9-8d0e-44cf-9485-d8b7aaf99968 \
            --project 8ecbd6e0-cd28-4dcd-9f0f-2908387a80b6 \
            --environment c3787ecc-dfe7-4f24-b980-a725d6becabe 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            if echo "$output" | grep -qi "Free-tier deploys"; then
              echo "::warning::Railway free-tier deployment is blocked during peak hours. The scheduled workflow will retry outside the Railway free-tier peak window."
              exit 0
            fi
            exit "$status"
          fi
