name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Dependency audit report
        if: always()
        run: npm audit --json > npm-audit-frontend.json || true
      - name: Summarize dependency findings
        if: always()
        run: |
          node -e 'const fs=require("fs");const f="npm-audit-frontend.json";if(!fs.existsSync(f))process.exit(0);const a=JSON.parse(fs.readFileSync(f));for(const [name,v] of Object.entries(a.vulnerabilities||{}))console.log(JSON.stringify({package:name,severity:v.severity,direct:v.isDirect,fix:v.fixAvailable,via:v.via.filter(x=>typeof x==="object").map(x=>({title:x.title,url:x.url,range:x.range}))}));'
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-frontend
          path: frontend/npm-audit-frontend.json
          retention-days: 14
      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
        run: npm run test:e2e

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Dependency audit report
        if: always()
        run: npm audit --json > npm-audit-backend.json || true
      - name: Summarize dependency findings
        if: always()
        run: |
          node -e 'const fs=require("fs");const f="npm-audit-backend.json";if(!fs.existsSync(f))process.exit(0);const a=JSON.parse(fs.readFileSync(f));for(const [name,v] of Object.entries(a.vulnerabilities||{}))console.log(JSON.stringify({package:name,severity:v.severity,direct:v.isDirect,fix:v.fixAvailable,via:v.via.filter(x=>typeof x==="object").map(x=>({title:x.title,url:x.url,range:x.range}))}));'
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-backend
          path: backend/npm-audit-backend.json
          retention-days: 14
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test -- --runInBand --passWithNoTests
