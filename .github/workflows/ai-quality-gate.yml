name: Kalatty AI - quality gate (read-only)

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/ai-quality-gate.yml'
      - '.github/workflows/qa-agent.yml'
      - 'scripts/qa-*.mjs'

permissions:
  contents: read

concurrency:
  group: ai-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-agent-unit:
    name: QA Agent unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/qa-utils.test.mjs scripts/qa-log-analysis.test.mjs scripts/developer-agent.test.mjs scripts/developer-patch.test.mjs scripts/developer-pr-plan.test.mjs scripts/developer-execution-gate.test.mjs

  backend:
    name: Backend - build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand --passWithNoTests

  frontend:
    name: Frontend - lint, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      - name: Save Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
